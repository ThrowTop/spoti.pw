name: Build custom kit

on:
  push:
    branches: [codex/fast-kit-builds]
    paths:
      - 'tweak/**'
      - 'extension/**'
      - 'vendor/audio/**'
      - 'icons/**'
      - 'plist/**'
      - 'scripts/**'
      - 'version.txt'
      - '.github/workflows/build-kit.yml'
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Bootstrap only: decrypted Spotify 9.1.78 URL (otherwise uses the secret)'
        type: string
        required: false
      clean:
        description: 'Recompile all tweak objects'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: custom-kit-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos
  THEOS_REF: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
  KIT_BASE_SHA256: ${{ vars.KIT_BASE_SHA256 }}

jobs:
  kit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Identify toolchain and base inputs
        id: config
        run: |
          test -n "$KIT_BASE_SHA256" || { echo '::error::Set the KIT_BASE_SHA256 repository variable'; exit 1; }
          echo "xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
          echo "extractor=$(shasum -a 256 scripts/extract-flags.py | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore small base inputs
        id: inputs
        uses: actions/cache@v4
        with:
          path: out/kit-inputs
          key: kit-inputs-v1-${{ env.KIT_BASE_SHA256 }}-${{ steps.config.outputs.extractor }}

      - name: Recover inputs artifact or bootstrap once
        if: steps.inputs.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.ipa_url }}
          BOOTSTRAP_URL: ${{ secrets.KIT_BOOTSTRAP_IPA_URL }}
          INPUT_NAME: kit-inputs-${{ env.KIT_BASE_SHA256 }}-${{ steps.config.outputs.extractor }}
        run: |
          mkdir -p out/kit-inputs
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts | map(select(.name == \"$INPUT_NAME\" and (.expired | not))) | first.id // empty")
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/kit-inputs.zip"
            unzip -q "$RUNNER_TEMP/kit-inputs.zip" -d out/kit-inputs
          else
            url="${INPUT_URL:-$BOOTSTRAP_URL}"
            test -n "$url" || { echo '::error::Inputs expired: bootstrap again with scripts/dev-build.ps1 -Bootstrap'; exit 1; }
            echo "::add-mask::$url"
            curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/base.ipa"
            python3 - "$RUNNER_TEMP/base.ipa" <<'PY'
          import hashlib, os, sys
          with open(sys.argv[1], 'rb') as f:
              actual = hashlib.file_digest(f, 'sha256').hexdigest()
          if actual != os.environ['KIT_BASE_SHA256']: raise SystemExit('Base IPA SHA-256 mismatch')
          PY
            python3 scripts/extract-flags.py "$RUNNER_TEMP/base.ipa"
            python3 scripts/kit-inputs.py out/kit-inputs --ipa "$RUNNER_TEMP/base.ipa" --sha256 "$KIT_BASE_SHA256"
            rm -f "$RUNNER_TEMP/base.ipa"
          fi

      - name: Validate base inputs
        run: python3 scripts/kit-inputs.py out/kit-inputs --sha256 "$KIT_BASE_SHA256"

      # Renew this recovery artifact on every run. It contains metadata, flags and the icon catalog,
      # not Spotify's executable or the full IPA. Download a local backup before 90 days of inactivity.
      - uses: actions/upload-artifact@v7
        with:
          name: kit-inputs-${{ env.KIT_BASE_SHA256 }}-${{ steps.config.outputs.extractor }}
          path: out/kit-inputs/*
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Restore Theos and its compiler support tools
        id: theos
        uses: actions/cache/restore@v4
        with:
          path: theos
          key: kit-theos-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.config.outputs.xcode }}-${{ env.THEOS_REF }}

      - uses: actions/checkout@v5
        if: steps.theos.outputs.cache-hit != 'true'
        with:
          repository: theos/theos
          ref: ${{ env.THEOS_REF }}
          path: theos
          submodules: recursive

      - name: Install missing tools
        run: |
          missing=()
          command -v gmake >/dev/null || missing+=(make)
          command -v ldid >/dev/null || missing+=(ldid)
          if [ "${#missing[@]}" -gt 0 ]; then brew install "${missing[@]}"; fi

      - name: Restore compiled objects and auxiliary binaries
        id: native
        uses: actions/cache/restore@v4
        with:
          path: |
            tweak/.theos
            vendor/audio/build/ios
            out/kit-support
            out/kit-cache
          key: kit-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.config.outputs.xcode }}-${{ env.THEOS_REF }}-${{ env.KIT_BASE_SHA256 }}-${{ hashFiles('tweak/Makefile', 'vendor/audio/Makefile', 'version.txt') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kit-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.config.outputs.xcode }}-${{ env.THEOS_REF }}-${{ env.KIT_BASE_SHA256 }}-${{ hashFiles('tweak/Makefile', 'vendor/audio/Makefile', 'version.txt') }}-

      - name: Compile and package custom kit
        id: compile
        env:
          KIT_CLEAN: ${{ inputs.clean || 'false' }}
        run: |
          started=$SECONDS
          bash scripts/build-kit.sh
          mkdir -p out/kit-artifact
          cp out/*-kit.zip scripts/patcher.mjs out/kit-artifact/
          echo "### Custom kit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compile and package: $((SECONDS-started)) seconds" >> "$GITHUB_STEP_SUMMARY"
          echo '- Patch locally with Node 24+: `node scripts/patcher.mjs BASE.ipa KIT.zip out`' >> "$GITHUB_STEP_SUMMARY"

      - name: Save Theos even after a source compile error
        if: ${{ !cancelled() && steps.theos.outcome == 'success' && steps.theos.outputs.cache-hit != 'true' && hashFiles('theos/makefiles/common.mk') != '' }}
        uses: actions/cache/save@v4
        with:
          path: theos
          key: ${{ steps.theos.outputs.cache-primary-key }}

      - name: Checkpoint source timestamps
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        run: python3 scripts/source-mtimes.py save

      - name: Save compiled objects even after a source compile error
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            tweak/.theos
            vendor/audio/build/ios
            out/kit-support
            out/kit-cache
          key: ${{ steps.native.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: custom-kit
          path: out/kit-artifact/*
          compression-level: 0
          if-no-files-found: error
